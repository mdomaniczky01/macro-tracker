<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Plato</title>
<meta name="description" content="Tu plan nutricional, tus macros y un recetario simple.">
<meta name="theme-color" content="#F5EEE2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Plato">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">
  <main id="view"></main>
  <nav id="tabs" aria-label="Navegación"></nav>
</div>
<div id="sheet-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript>Plato necesita JavaScript para funcionar.</noscript>
<script>
/* Red de seguridad: si la app no arranca, mostramos el motivo y un botón para repararla (los datos no se tocan). */
(function () {
  var shown = false, last = '';
  function panel(msg) {
    if (shown || window.__booted) return;
    shown = true;
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#F5EEE2;color:#3B2418;font:16px/1.45 -apple-system,system-ui,sans-serif;padding:max(28px,env(safe-area-inset-top)) 22px 22px;overflow:auto';
    d.innerHTML = '<h1 style="font:700 30px ui-serif,Georgia,serif;margin:20px 0 8px">Plato</h1>' +
      '<p style="margin:0 0 16px;color:#7A5A48">No pude arrancar. Casi seguro es una versión vieja guardada en el teléfono. Tus datos están a salvo.</p>' +
      '<button id="wd-fix" style="width:100%;height:54px;border:0;border-radius:16px;background:#6E1F2E;color:#FFF7EA;font:600 17px -apple-system,system-ui,sans-serif">Reparar y reabrir</button>' +
      '<button id="wd-copy" style="width:100%;height:48px;margin-top:10px;border:1.5px solid #6E1F2E;border-radius:16px;background:transparent;color:#6E1F2E;font:600 15px -apple-system,system-ui,sans-serif">Copiar mis datos (respaldo)</button>' +
      '<pre style="margin-top:18px;white-space:pre-wrap;font-size:12px;color:#8A6D5B">' + String(msg || last || 'sin detalle').replace(/</g, '&lt;') + '</pre>';
    document.body.appendChild(d);
    document.getElementById('wd-fix').onclick = function () {
      var jobs = [];
      try { jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })); } catch (e) {}
      try { jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })); } catch (e) {}
      Promise.all(jobs).catch(function () {}).then(function () { location.replace(location.pathname + '?r=' + Date.now()); });
    };
    document.getElementById('wd-copy').onclick = function () {
      var t = ''; try { t = localStorage.getItem('plato.v1') || ''; } catch (e) {}
      try { navigator.clipboard.writeText(t).then(function () { alert('Copiado. Pegalo en Notas para guardarlo.'); }); } catch (e) { prompt('Copiá este texto:', t); }
    };
  }
  window.addEventListener('error', function (e) { last = (e.message || 'error') + (e.filename ? '\n' + e.filename + ':' + e.lineno : ''); setTimeout(function () { panel(last); }, 300); });
  window.addEventListener('unhandledrejection', function (e) { last = String(e.reason && (e.reason.stack || e.reason.message) || e.reason); setTimeout(function () { panel(last); }, 300); });
  setTimeout(function () { panel(last); }, 3500);
})();
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
