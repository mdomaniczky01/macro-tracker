<style>
:root {
  --bg: #F5EEE2;
  --bg2: #EFE5D4;
  --card: #FCF8F0;
  --ink: #3A2920;
  --muted: #8B7566;
  --line: #E3D5C1;
  --bordo: #6E1F2E;
  --bordo2: #8E2F42;
  --bordo-soft: #EBD5D6;
  --p: #7A2233;       /* proteína */
  --c: #D3AE7E;       /* hidratos */
  --f: #8F6B50;       /* grasas */
  --veg: #8B9A69;     /* verduras */
  --warn: #B5452F;
  --ok: #5E7A4C;
  --r: 20px;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --serif: ui-serif, "New York", "Iowan Old Style", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans);
  font-size: 15px; line-height: 1.35; -webkit-text-size-adjust: 100%;
  overscroll-behavior-y: none;
}
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; font-size: 16px; }
b, strong { font-weight: 650; }
#app { max-width: 480px; margin: 0 auto; min-height: 100dvh; position: relative; overflow-x: clip; }
html, body { overflow-x: hidden; }
input { min-width: 0; }
#view { padding-bottom: calc(96px + var(--sab)); }
.serif { font-family: var(--serif); }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

/* ---------- barra de pestañas ---------- */
#tabs {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: min(100%, 480px); z-index: 20;
  display: grid; grid-template-columns: 1fr 1fr 78px 1fr 1fr; align-items: end;
  padding: 8px 6px calc(8px + var(--sab));
  background: color-mix(in srgb, var(--card) 95%, transparent);
  -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
  border-top: 1px solid var(--line);
}
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 0; color: var(--muted); font-size: 11px; font-weight: 550; letter-spacing: .01em; }
.tab svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.tab.on { color: var(--bordo); }
.tab-plate { position: relative; margin-top: -26px; color: var(--bordo); }
.tab-plate .bubble {
  width: 58px; height: 58px; border-radius: 50%; background: var(--bordo); color: var(--bg);
  display: grid; place-items: center; box-shadow: 0 8px 20px rgba(110,31,46,.35), 0 0 0 5px var(--bg);
  transition: transform .2s;
}
.tab-plate:active .bubble { transform: scale(.94); }
.tab-plate .bubble svg { width: 30px; height: 30px; stroke: var(--bg); }
.tab-plate span { margin-top: 2px; }

/* ---------- pantalla ---------- */
.screen { padding: calc(14px + var(--sat)) 16px 0; animation: fade .25s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.head h1 { font-family: var(--serif); font-weight: 600; font-size: 28px; letter-spacing: -.01em; margin: 0; }
.head .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
  padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 0 rgba(255,255,255,.6) inset, 0 6px 18px rgba(90,60,40,.05);
}
.card h3 { margin: 0 0 10px; font-size: 13px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.card h3 .r { float: right; text-transform: none; letter-spacing: 0; font-weight: 500; }
.sec { margin: 22px 2px 10px; display: flex; justify-content: space-between; align-items: baseline; }
.sec h2 { font-family: var(--serif); font-size: 20px; font-weight: 600; margin: 0; }
.link { color: var(--bordo); font-weight: 600; font-size: 14px; }

/* ---------- botones / chips ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 48px; padding: 0 20px; border-radius: 16px; font-weight: 650; font-size: 16px;
  background: var(--bordo); color: #FFF7EA; transition: transform .12s, background .2s;
}
.btn:active { transform: scale(.97); background: var(--bordo2); }
.btn.ghost { background: transparent; color: var(--bordo); border: 1.5px solid var(--bordo); }
.btn.soft { background: var(--bordo-soft); color: var(--bordo); }
.btn.block { width: 100%; }
.btn.sm { height: 38px; padding: 0 14px; font-size: 14px; border-radius: 12px; }
.btn[disabled] { opacity: .4; pointer-events: none; }
.btn.danger { background: transparent; color: var(--warn); border: 1.5px solid #E0B9AE; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 16px 4px; margin: 0 -16px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto; height: 36px; padding: 0 14px; border-radius: 999px; background: var(--card); border: 1px solid var(--line);
  color: var(--ink); font-size: 14px; font-weight: 550; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  transition: background .15s, color .15s, transform .1s;
}
.chip:active { transform: scale(.96); }
.chip.on { background: var(--bordo); color: #FFF7EA; border-color: var(--bordo); }
.chip .d { width: 9px; height: 9px; border-radius: 50%; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--bordo); background: var(--card); border: 1px solid var(--line); }
.icon-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- barras ---------- */
.track { position: relative; height: 12px; border-radius: 99px; background: var(--bg2); overflow: hidden; }
.track.tall { height: 16px; }
.track i { position: absolute; top: 0; bottom: 0; left: 0; width: 0; border-radius: 99px; transition: width .55s cubic-bezier(.2,.8,.2,1), left .55s cubic-bezier(.2,.8,.2,1), background .3s; }
.track .mark { width: 2px !important; background: var(--ink); opacity: .55; border-radius: 0; transition: left .55s cubic-bezier(.2,.8,.2,1); }
.irow { margin-bottom: 12px; }
.irow:last-child { margin-bottom: 0; }
.ihead { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; font-size: 13px; }
.ihead .l { font-weight: 650; display: flex; align-items: center; gap: 7px; }
.ihead .l .d { width: 9px; height: 9px; border-radius: 50%; }
.ihead .v { color: var(--muted); }
.ihead .v b { color: var(--ink); }
.ihead .v .plus { color: var(--bordo); font-weight: 650; }
.irow .eaten { background: var(--col); }
.irow .plate { background: repeating-linear-gradient(135deg, var(--col) 0 5px, color-mix(in srgb, var(--col) 55%, #fff) 5px 10px); animation: slide 1.2s linear infinite; background-size: 28px 28px; }
@keyframes slide { to { background-position: 28px 0; } }
.irow.over .ihead .v b, .irow.over .plus { color: var(--warn); }
.irow.over .plate { background: repeating-linear-gradient(135deg, var(--warn) 0 5px, #D98B79 5px 10px); background-size: 28px 28px; }
.irow[data-m="k"] { --col: var(--bordo); }
.irow[data-m="p"] { --col: var(--p); }
.irow[data-m="c"] { --col: var(--c); }
.irow[data-m="f"] { --col: var(--f); }
.after { margin-top: 12px; padding: 10px 12px; border-radius: 14px; background: var(--bg2); font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.after b { color: var(--ink); }
.after .neg b { color: var(--warn); }

/* ---------- resumen de hoy ---------- */
.date-nav { display: flex; align-items: center; gap: 6px; }
.date-nav .lbl { font-weight: 650; min-width: 92px; text-align: center; font-size: 15px; }
.sum-top { display: flex; gap: 16px; align-items: center; }
.ring { position: relative; width: 132px; height: 132px; flex: 0 0 auto; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }

}

  function mountEditor() {
    const P = DS.portion, cv = $("#ph-cv");
    if (!cv) return;
    const refresh = () => {
      P.paintOverlay(measuredIdx().map(dsColor));
      DS.counts = P.counts(measuredIdx().length);
      drawCanvas();
      paintResults();
      drawDsChips();
      dsFoot();
    };
    DS.refresh = refresh;
    const pt = (e) => {
      const r = cv.getBoundingClientRect();
      return { x: (e.clientX - r.left) / r.width * P.W, y: (e.clientY - r.top) / r.height * P.H };
    };
    let drag = null, raf = 0;
    const later = () => {
      if (!raf) raf = requestAnimationFrame(() => {
        raf = 0;
        refresh();
      });
    };
    cv.addEventListener("pointerdown", (e) => {
      cv.setPointerCapture(e.pointerId);
      const p = pt(e);
      drag = { sx: p.x, sy: p.y, ox: P.circle.cx, oy: P.circle.cy, moved: false };
      if (DS.pstage === "zones" && DS.tool !== "wand") {
        P.snapshot();
        P.brush(p.x, p.y, DS.brush, DS.tool === "erase" ? 0 : DS.active + 1);
        later();
      }
    });
    cv.addEventListener("pointermove", (e) => {
      if (!drag) return;
      const p = pt(e);
      if (Math.hypot(p.x - drag.sx, p.y - drag.sy) > 3) drag.moved = true;
      if (DS.pstage === "plate") {
        P.circle.cx = clamp(drag.ox + p.x - drag.sx, 0, P.W);
        P.circle.cy = clamp(drag.oy + p.y - drag.sy, 0, P.H);
        later();
      } else if (DS.tool !== "wand") {
        P.brush(p.x, p.y, DS.brush, DS.tool === "erase" ? 0 : DS.active + 1);
        later();
      }
    });
    const end = (e) => {
      if (!drag) return;
      const p = pt(e);
      if (DS.pstage === "zones" && DS.tool === "wand" && !drag.moved) {
        const n = P.wand(p.x, p.y, DS.active + 1, DS.tol);
        if (!n) toast("Esa zona se mezcla con el plato: us\xE1 el pincel o baj\xE1 la sensibilidad");
        else if (P.lastTol < DS.tol - 0.5) toast("Era muy grande: baj\xE9 la sensibilidad solo para esta zona");
        later();
      }
      drag = null;
    };
    cv.addEventListener("pointerup", end);
    cv.addEventListener("pointercancel", () => {
      drag = null;
    });
    requestAnimationFrame(refresh);
  }
  function drawCanvas() {
    const cv = $("#ph-cv"), P = DS.portion;
    if (!cv) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1), cssW = cv.clientWidth || 340;
    const w = Math.round(cssW * dpr), h = Math.round(cssW * P.H / P.W * dpr);
    if (cv.width !== w || cv.height !== h) {
      cv.width = w;
      cv.height = h;
    }
    const ctx = cv.getContext("2d"), s = w / P.W;
    ctx.clearRect(0, 0, w, h);
    ctx.drawImage(DS.img, 0, 0, w, h);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(P.overlayCanvas, 0, 0, w, h);
    ctx.imageSmoothingEnabled = true;
    const { cx, cy, r } = P.circle;
    ctx.save();
    ctx.fillStyle = "rgba(40,22,16,.38)";
    ctx.beginPath();
    ctx.rect(0, 0, w, h);
    ctx.arc(cx * s, cy * s, r * s, 0, Math.PI * 2, true);
    ctx.fill("evenodd");
    ctx.setLineDash([10 * dpr, 7 * dpr]);
    ctx.lineWidth = 2.5 * dpr;
    ctx.strokeStyle = "#FBF5EA";
    ctx.beginPath();
    ctx.arc(cx * s, cy * s, r * s, 0, Math.PI * 2);
    ctx.stroke();

      render();
    },
    "rf-carb": (el) => {
      UI.rf.carb = UI.rf.carb === el.dataset.v ? null : el.dataset.v;
      UI.rf.limit = 50;
      render();
    },
    "rf-meal": (el) => {
      UI.rf.meal = UI.rf.meal === el.dataset.v ? null : el.dataset.v;
      UI.rf.limit = 50;
      render();
    },
    "rf-more": () => {
      UI.rf.limit += 50;
      render();
    },
    "rc-step": (el) => {
      RC.mult = clamp(RC.mult + +el.dataset.d, 0.25, 3);
      paintRecipe(false);
    },
    "rc-oil": () => {
      RC.oil = !RC.oil;
      paintRecipe(false);
    },
    "rc-meal": (el) => {
      RC.meal = el.dataset.meal;
      $$('[data-act="rc-meal"]', sheetEl()).forEach((b) => b.classList.toggle("on", b.dataset.meal === RC.meal));
    },
    "rc-fav": () => {
      const i = S.favRecipes.indexOf(RC.r.id);
      if (i >= 0) S.favRecipes.splice(i, 1);
      else S.favRecipes.push(RC.r.id);
      save();
      paintRecipe(false);
      if (UI.tab === "recetas") render();
    },
    "rc-add": () => {
      const e = recipeEntry(RC.r, RC.mult, RC.meal);
      if (RC.oil) {
        const o = FM().aceite_oliva, pg = foodPer(o);
        e.per = { k: e.per.k + pg.k * 13 / RC.mult, p: e.per.p, c: e.per.c, f: e.per.f + pg.f * 13 / RC.mult };
        e.items.push({ fid: "aceite_oliva", g: 13 / RC.mult });
      }
      addEntry(RC.date, e);
      pushRecent("recipe", RC.r.id);
      closeSheet();
      render();
      toast(`Agregado a ${mealName(RC.meal)}`);
    },
    "rc-plate": () => loadPlate(rcItems().map(([f, g]) => [f, Math.round(g)]), RC.meal, RC.r.name),
    "rc-delete": () => {
      S.customRecipes = S.customRecipes.filter((r) => r.id !== RC.r.id);
      S.favRecipes = S.favRecipes.filter((i) => i !== RC.r.id);
      save();
      closeSheet();
      render();
      toast("Receta eliminada");
    },
    // picker
    "pk-tab": (el) => {
      PK.tab = el.dataset.tab;
      PK.q = "";
      drawPicker();
    },
    "pk-pick": (el) => {
      if (el.dataset.type === "recipe") {
        const m = PK.meal, d = PK.date;
        PK.back = true;
        openRecipe(el.dataset.id, { meal: m });
        RC.date = d;
        return;
      }
      if (PK.mode === "plate") {
        closeSheet();
        plateAddFood(el.dataset.id);
        toast("Sumado al plato");
        return;
      }
      openFoodDetail(el.dataset.id);
    },
    "pk-back": () => {
      openPicker({ mode: PK.mode, meal: PK.meal, date: PK.date });
    },
    "quick-add": () => {
      const v = (id) => parseFloat($(id).value) || 0, p = v("#q-p"), c = v("#q-c"), f = v("#q-f"), k = v("#q-k") || p * 4 + c * 4 + f * 9;
      if (!k) return toast("Carg\xE1 calor\xEDas o macros");
      addEntry(PK.date, { m: PK.meal, name: $("#q-n").value.trim() || "Comida r\xE1pida", qty: 1, unit: "porci\xF3n", step: 0.5, min: 0.5, max: 4, per: { k, p, c, f }, src: { t: "quick" } });
      closeSheet();
      render();
      toast(`Agregado a ${mealName(PK.meal)}`);
    },
    // detalle alimento
    "fd-mode": (el) => {
      FD.unit = el.dataset.v === "u";
      fdConfigure();
    },
    "fd-step": (el) => {
      const r = $("#fd-r"), st = +r.step;
      FD.q = clamp(FD.q + +el.dataset.d * (FD.unit ? st : st), +r.min, +r.max);
      paintFood();
    },
    "fd-meal": (el) => {
      FD.meal = el.dataset.meal;
      $$('[data-act="fd-meal"]', sheetEl()).forEach((b) => b.classList.toggle("on", b.dataset.meal === FD.meal));
    },
    "fd-add": () => {
      const { f, pg } = FD, per = FD.unit ? f.u.g : 1;
      const cfg = rangeCfg(f);
      addEntry(FD.date, {
        m: FD.meal,
        name: fname(f),
        qty: FD.q,
        unit: FD.unit ? f.u.n : "g",
        step: FD.unit ? f.u.step : cfg.step,
        min: 0,
        max: FD.unit ? 8 : cfg.max,
        per: { k: pg.k * per, p: pg.p * per, c: pg.c * per, f: pg.f * per },
        src: { t: "food", id: f.id }
      });
      pushRecent("food", f.id);
      closeSheet();
      render();
      toast(`Agregado a ${mealName(FD.meal)}`);
    },
    // editar entrada
    "ed-step": (el) => {
      const e = findEntry(ED.date, ED.id), r = $("#ed-r");
      ED.qty = clamp(ED.qty + +el.dataset.d * +r.step, +r.min, +r.max);
      paintEntry();
    },
    "ed-meal": (el) => {
      ED.meal = el.dataset.meal;
      $$('[data-act="ed-meal"]', sheetEl()).forEach((b) => b.classList.toggle("on", b.dataset.meal === ED.meal));
    },
    "ed-save": () => {
      const e = findEntry(ED.date, ED.id);
      e.qty = ED.qty;
      e.m = ED.meal;
      save();
      closeSheet();
      render();
    },
    "ed-delete": () => {
      removeEntry(ED.date, ED.id);
      closeSheet();
      render();
      toast("Eliminado");
    },
    "ed-plate": () => {
      const e = findEntry(ED.date, ED.id);
      loadPlate(e.items.map((i) => [i.fid, Math.max(1, Math.round(i.g * ED.qty))]), ED.meal, e.name, { id: e.id });
    },
    // formularios
    "food-form": (el) => {
      formFromPicker = !!(el.closest("#pk-list") && PK);
      openFoodForm();
    },
    "nf-gl": (el) => el.classList.toggle("on"),
    "nf-la": (el) => el.classList.toggle("on"),
    "nf-save": saveFood,
    "del-food": (el) => {
      S.customFoods = S.customFoods.filter((f) => f.id !== el.dataset.id);
      dropFoodCache();
      save();
      openMyFoods();
    },
    "del-recipe": (el) => {
      S.customRecipes = S.customRecipes.filter((r) => r.id !== el.dataset.id);
      save();
      openMyRecipes();
    },
    // progreso / ajustes
    "weight-save": () => {
      const v = parseFloat($("#w-kg").value);
      if (!(v > 20 && v < 300)) return toast("Ingres\xE1 un peso v\xE1lido");
      addWeight(todayISO(), v);
      render();
      toast("Peso guardado");
    },
    "set-toggle": (el) => {
      S.settings[el.dataset.k] = !S.settings[el.dataset.k];
      save();
      render();
    },
    "set-carb": (el) => {
      S.settings.carbState = el.dataset.v;
      save();
      render();
      toast(`Pesos en ${el.dataset.v === "cocido" ? "cocido" : "crudo"}`);
    },
    "plan-info": openPlanInfo,
    "my-foods": openMyFoods,
    "my-recipes": openMyRecipes,
    backup: openBackup,
    "bk-copy": async () => {
      try {
        await navigator.clipboard.writeText(window.__bk);
        toast("Respaldo copiado");
      } catch (e) {
        toast("No se pudo copiar");
      }
    },
    "bk-share": async () => {
      const file = new File([window.__bk], `plato-respaldo-${todayISO()}.json`, { type: "application/json" });
      try {
        if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], title: "Respaldo Plato" });
        else {
          const a = document.createElement("a");
          a.href = URL.createObjectURL(file);
          a.download = file.name;
          a.click();
        }
      } catch (e) {
      }
    },
    "bk-restore": () => {
      try {
        const d = JSON.parse($("#bk-text").value);
        if (!d || !d.settings) throw new Error("x");
        replaceState(d);
        toast("Datos restaurados");
        setTimeout(() => location.reload(), 600);
      } catch (e) {
        toast("El texto no es un respaldo v\xE1lido");
      }
    },
    reset: () => {
      openSheet({ title: "\xBFBorrar todo?", body: '<p style="margin:0;font-size:15px">Se elimina el diario, tus recetas, alimentos y pesos de este dispositivo. No se puede deshacer.</p>', foot: '<button class="btn ghost" data-act="sheet-close">Cancelar</button><button class="btn danger" data-act="reset-ok">Borrar</button>' });
    },
    "reset-ok": () => {
      resetState();
      location.reload();
    }
  };
  var INP = {
    "ds-text": (el) => {
      DS.text = el.value;
      clearTimeout(INP._d);
      INP._d = setTimeout(() => {
        reparse();
        drawDsChips();
        dsFoot();
      }, 140);
    },
    "ph-file": (el) => dsFile(el.files && el.files[0]),
    "ph-r": (el) => {
      const P = DS.portion;
      P.circle.r = +el.value / 100 * Math.min(P.W, P.H);
      DS.refresh();
    },
    "ph-size": (el) => {
      if (DS.tool === "wand") DS.tol = +el.value;
      else DS.brush = +el.value;
    },
    "rf-q": (el) => {
      UI.rf.q = el.value;
      UI.rf.limit = 50;
      clearTimeout(INP._t);
      INP._t = setTimeout(() => {
        const pos = el.selectionStart;
        render();
        const n = $('input[data-in="rf-q"]');
        n.focus();
        n.setSelectionRange(pos, pos);
      }, 220);
    },
    "pk-q": (el) => {
      PK.q = el.value;
      drawPickerList();
    },
    "plate-g": (el) => {
      const it = PLATE.items.find((i) => i.u === el.dataset.uid);
      if (!it) return;
      it.g = +el.value;
      savePlate();
      paintPlate(false);
    },
    "rc-mult": (el) => {
      RC.mult = +el.value;
      paintRecipe(false);
    },
    "fd-r": (el) => {
      FD.q = +el.value;
      paintFood();
    },
    "ed-r": (el) => {
      ED.qty = +el.value;
      paintEntry();
    },
    "t-in": () => paintTargets(),
    "q-in": () => paintQuick(),
    prof: (el) => {
      const k = el.dataset.k;
      S.settings[k] = el.type === "number" ? parseFloat(el.value) || 0 : el.value;
      save();
    }
  };
  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-act]");
    if (!el) return;
    const fn = ACT[el.dataset.act];
    if (fn) fn(el, e);
  });
  document.addEventListener("change", (e) => {
    const el = e.target.closest('[data-in="ph-file"]');
    if (el) INP["ph-file"](el);
  });
  document.addEventListener("input", (e) => {
    const el = e.target.closest("[data-in]");
    if (el && INP[el.dataset.in]) INP[el.dataset.in](el, e);
  });
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && UI._today !== todayISO()) {
      if (UI.date === UI._today) UI.date = todayISO();
      UI._today = todayISO();
      if (!sheetEl()) render();
    }
  });
  UI._today = todayISO();
  render();
  window.__booted = true;
  if (!S.settings.onboarded && !targets().isSet) setTimeout(() => {
    if (!sheetEl()) openTargets();
  }, 450);
  try {
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  } catch (e) {
  }
})();

</script>
</body>
</html>
